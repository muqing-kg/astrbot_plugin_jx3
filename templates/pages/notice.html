{# template-title: 通知管理 #}
<div class="container notice-page">
    <div class="notice-hero">
        <div class="notice-kicker">JX3 · NOTICE</div>
        <h1>通知管理</h1>
        <p>{{ display_name }} · {{ server }}</p>
    </div>
    {% for group in groups %}
    <section class="notice-group">
        <div class="notice-group-head">
            <strong>{{ group.name }}</strong>
            <span>{{ group.enabled_count }} / {{ group.total }} 已开启</span>
        </div>
        <div class="notice-grid">
            {% for item in group.items %}
            <div class="notice-item {% if item.enabled %}is-on{% else %}is-off{% endif %}">
                <span class="notice-dot"></span>
                <span class="notice-name">{{ item.name }}</span>
                <span class="notice-state">{% if item.enabled %}开启{% else %}关闭{% endif %}</span>
            </div>
            {% endfor %}
        </div>
    </section>
    {% endfor %}
</div>
