{# template-title: 奇遇汇总 #}
{# template-components: data-layout collection-card #}


<div class="container">
<div class="card-grid" style="--grid-columns: 3">
        {% for m in items %}
        <div class="collection-card">
            {% if icons.serendipity.get(m.event) %}
            <img class="collection-card__image" src="{{ icons.serendipity[m.event] }}" alt="{{ m.event }}">
            {% else %}
            <div class="collection-card__name">{{ m.event }}</div>
            {% endif %}
            <div class="collection-card__name">{{ m.latest_name }}</div>
            <div class="collection-card__meta">{{ m.latest_time }}</div>
            <div class="collection-card__meta">{{ m.count }} 次</div>
        </div>
        {% endfor %}
    </div>
</div>
