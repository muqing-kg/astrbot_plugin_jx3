{# template-title: 避雷查看 #}
{# template-components: data-table #}


<div class="container data-page">
    <h1>避雷列表</h1>
    <table class="data-table table-striped">
        <thead>
            <tr>
                <th>序号</th>
                <th>名称</th>
                <th>备注</th>
                <th>添加时间</th>
                <th>添加人</th>
            </tr>
        </thead>
        <tbody>
        {% for m in lists %}
            <tr>
                <td>{{ m.id }}</td>
                <td>{{ m.name }}</td>
                <td class="data-cell--copy">{{ m.text }}</td>
                <td>{{ m.time }}</td>
                <td>{{ m.user }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
