{# template-title: 区服奇遇 #}
{# template-components: data-layout collection-card #}


<div class="container">
<div class="card-grid" style="--grid-columns: 3">
        {% for m in items %}
        <div class="collection-card">
            <div class="collection-card__name">{{ m.name }}</div>
            <div class="collection-card__meta">{{ m.time }}</div>
            <div class="collection-card__meta">{{ m.event }} · {{ m.server }}</div>
        </div>
        {% endfor %}
    </div>
</div>
