{# template-title: 帮助 #}
<div class="container help-page">
    <div class="help-title">
        <img src="{{ icons.img.get('jx3', '') }}" alt="">
        <strong>帮助</strong>
    </div>
    <table class="help-table">
        <thead>
            <tr>
                <th>功能</th>
                <th>命令</th>
                <th>示例</th>
            </tr>
        </thead>
        <tbody>
        {% set ns = namespace(group='') %}
        {% for row in rows %}
        <tr>
            <td class="help-feature">{% if row.group != ns.group %}{{ row.group }}{% endif %}</td>
            <td class="help-command">{{ row.command }}</td>
            <td class="help-example">{{ row.example }}</td>
        </tr>
        {% set ns.group = row.group %}
        {% endfor %}
        </tbody>
    </table>
</div>
