<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剑三插件配置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>插件配置</h1>
          <p class="sub">会话、命令、区服都在这一页。用上方标签切换。</p>
        </div>
        <div class="header-actions">
          <button id="resetBtn" class="ghost" type="button" hidden>恢复默认</button>
          <button id="refreshBtn" type="button">刷新</button>
        </div>
      </header>
      <nav class="tabs" aria-label="配置分类">
        <button class="tab-btn active" type="button" data-view="sessions">会话配置</button>
        <button class="tab-btn" type="button" data-view="commands">命令配置</button>
        <button class="tab-btn" type="button" data-view="servers">区服配置</button>
      </nav>
      <p id="status" class="status" hidden></p>
      <section class="view-panel active" data-view-panel="sessions">
        <section id="cards" class="cards"></section>
      </section>
      <section class="view-panel" data-view-panel="commands">
        <section id="commandList" class="list"></section>
      </section>
      <section class="view-panel" data-view-panel="servers">
        <section id="serverList" class="list"></section>
      </section>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
